{% extends "base.html" %}
{% block content %}
  <div class="bg-white rounded shadow p-6">
    <h1 class="text-2xl font-semibold">Welcome to TaskManager</h1>
    <p class="mt-2 text-gray-700">A simple app to manage tasks. Please register or login to continue.</p>
    <div class="mt-4">
      <a href="{{ url_for('auth.register') }}" class="inline-block bg-blue-600 text-white px-4 py-2 rounded">Register</a>
      <a href="{{ url_for('auth.login') }}" class="inline-block border ml-2 px-4 py-2 rounded">Login</a>
    </div>
  </div>
{% endblock %}
