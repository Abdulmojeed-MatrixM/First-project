<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard</title>
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <main class="main-card">
    <h1 class="text-xl font-semibold mb-4">Your Tasks</h1>

    {% if message %}
      <div class="flash-item flash-success mb-3">{{ message }}</div>
    {% endif %}

    {% include '_flash.html' %}

    {% if tasks %}
      <div class="space-y-3">
        {% for t in tasks %}
          <div class="task">
            <div>
              <div class="font-medium">{{ t['title'] }}</div>
              <div class="meta">{{ t['description'] or '' }}</div>
            </div>
            <div class="meta">{{ t['due_date'] or '' }}</div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-sm text-muted">No tasks yet.</p>
    {% endif %}

    <div class="mt-6">
      <a href="{{ url_for('tasks.create_task') }}" class="btn-primary">Create Task</a>
    </div>
  </main>
</body>
</html>
