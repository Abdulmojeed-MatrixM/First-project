<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register</title>
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-md bg-white rounded-lg shadow-md p-6">
    <h1 class="text-xl font-semibold mb-4">Create account</h1>

    {% if message %}
      <div class="mb-3 p-3 rounded bg-green-50 border border-green-100 text-green-800 text-sm">{{ message }}</div>
    {% endif %}

    {% include '_flash.html' %}

    <form method="post" action="{{ url_for('auth.register') }}" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-600 mb-1" for="username">Username</label>
        <input id="username" name="username" required class="w-full px-3 py-2 border rounded-md"/>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" class="w-full px-3 py-2 border rounded-md"/>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required class="w-full px-3 py-2 border rounded-md"/>
      </div>
      <div class="flex items-center justify-between">
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">Register</button>
        <a href="{{ url_for('auth.login') }}" class="text-sm text-indigo-600 hover:underline">Already have an account?</a>
      </div>
    </form>
  </main>
</body>
</html>
