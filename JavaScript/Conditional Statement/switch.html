<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routing Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        #nav a {
            margin-bottom: 20px;
        }
        #nav a {
            margin: 0 10px;
            text-decoration: none;
            color: blue;
        }
        #content {
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Routing Example</h1>
    <div id="nav">
        <a href="#/" onclick="navigate(event, '/')">Home</a>
        <a href="#/about" onclick="navigate(event, '/about')">About</a>
        <a href="#/contact" onclick="navigate(event, '/contact')">Contact</a>
    </div>
    <div id="content">
        <h2>Welcome to the Home Page</h2>
        <p>This is the content area.</p>
    </div>

    <script>
        function navigate(event, path) {
            event.preventDefault();
            const contentDiv = document.getElementById('content');
            switch (path) {
                case '/':
                    contentDiv.innerHTML = '<h2>Welcome to the Home Page</h2><p>This is the content area.</p>';
                    break;
                case '/about':
                    contentDiv.innerHTML = '<h2>About Us</h2><p>This is the about page.</p>';
                    break;
                case '/contact':
                    contentDiv.innerHTML = '<h2>Contact Us</h2><p>This is the contact page.</p>';
                    break;
                default:
                    contentDiv.innerHTML = '<h2>404 Not Found</h2><p>The page you are looking for does not exist.</p>';
            }
        }
    </script>
</body>
</html>
