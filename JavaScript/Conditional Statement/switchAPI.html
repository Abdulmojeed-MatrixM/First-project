<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

        body {
            font-family: "Poppins", sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
        }

        form {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 300px;
        }

        button[type="submit"] {
            font-family: "Poppins", sans-serif;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #28a745;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #218838;
        }

        #weather-output {
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #fff;
            width: 80%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Weather API Example</h1>
    <form id="Weather-form" onsubmit="getWeather(event)">
        <input type="text" id="location-input" placeholder="Enter city name" required>
        <button type="submit">Get Weather</button>
    </form>
    <div id="weather-output">
        Enter a city name and click "Get Weather" to see the current weather information.
    </div>

    <script>
        async function getWeather(event) {
            event.preventDefault();
            const locationInput = document.getElementById("location-input").value.trim();
            const apiKey = "79e5489e9a8644bab7172550241406";
            const apiUrl = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${locationInput}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error("Weather data not found");
                }
                const data = await response.json();
                displayWeather(data);
            } catch (error) {
                document.getElementById("weather-output").innerText = "Error fetching weather data.";
                console.error("Error:", error);
            }
        }

        function displayWeather(data) {
            const weatherOutput = document.getElementById("weather-output");
            const location = data.location;
            const current = data.current;
            weatherOutput.innerHTML = `
                <h2>Weather in ${location.name}, ${location.country}</h2>
                <p>Temperature: ${current.temp_c} °C</p>
                <p>Condition: ${current.condition.text}</p>
                <p>Wind Speed: ${current.wind_kph} km/h</p>
            `;
        }
    </script>
</body>
</html>
