<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking System App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 2rem; }
        h1 { text-align: center; color: #1976d2; }
        label, input, button { display: block; width: 100%; margin-bottom: 1rem; }
        button { background: #1976d2; color: #fff; border: none; border-radius: 4px; padding: 0.7rem; cursor: pointer; }
        button:hover { background: #125ea2; }
        .output { background: #e3f2fd; border-radius: 4px; padding: 1rem; min-height: 40px; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>Simple Banking System App</h1>
    <div class="container">
        <label for="accountSelect">Select Account:</label>
        <select id="accountSelect">
            <option value="1">AbduLLah Abdulsalaam</option>
            <option value="2">Abidah Zakariyyah</option>
        </select>
        <label for="amountInput">Amount:</label>
        <input type="number" id="amountInput" placeholder="Enter amount">
        <button id="depositBtn">Deposit</button>
        <button id="withdrawBtn">Withdraw</button>
        <button id="balanceBtn">Check Balance</button>
        <button id="infoBtn">Account Info</button>
        <div id="output" class="output"></div>
    </div>
    <script>
        // BankAccount class definition
        class BankAccount {
            constructor(accountNumber, accountHolder, balance = 0) {
                this.accountNumber = accountNumber;
                this.accountHolder = accountHolder;
                this.balance = balance;
            }
            deposit(amount) {
                this.balance += amount;
                return `$${amount} deposited. Current balance: $${this.balance}`;
            }
            withdraw(amount) {
                if (amount > this.balance) {
                    return `Insufficient funds. Current balance: $${this.balance}`;
                } else {
                    this.balance -= amount;
                    return `$${amount} withdrawn. Current balance: $${this.balance}`;
                }
            }
            checkBalance() {
                return `The current account balance for ${this.accountHolder}: $${this.balance}`;
            }
            displayAccountInfo() {
                return `Account Number: ${this.accountNumber}, Account Holder: ${this.accountHolder}, Balance: $${this.balance}`;
            }
        }

        // Create account instances
        const account1 = new BankAccount(123456, "AbduLLah Abdulsalaam", 3500);
        const account2 = new BankAccount(654321, "Abidah Zakariyyah");

        // Get DOM elements
        const accountSelect = document.getElementById('accountSelect');
        const amountInput = document.getElementById('amountInput');
        const depositBtn = document.getElementById('depositBtn');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const balanceBtn = document.getElementById('balanceBtn');
        const infoBtn = document.getElementById('infoBtn');
        const output = document.getElementById('output');

        // Helper to get selected account
        function getSelectedAccount() {
            return accountSelect.value === "1" ? account1 : account2;
        }

        // Deposit event
        depositBtn.addEventListener('click', () => {
            const account = getSelectedAccount();
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                output.innerText = "Please enter a valid deposit amount.";
                return;
            }
            output.innerText = account.deposit(amount);
            amountInput.value = "";
        });

        // Withdraw event
        withdrawBtn.addEventListener('click', () => {
            const account = getSelectedAccount();
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                output.innerText = "Please enter a valid withdrawal amount.";
                return;
            }
            output.innerText = account.withdraw(amount);
            amountInput.value = "";
        });

        // Check balance event
        balanceBtn.addEventListener('click', () => {
            const account = getSelectedAccount();
            output.innerText = account.checkBalance();
        });

        // Account info event
        infoBtn.addEventListener('click', () => {
            const account = getSelectedAccount();
            output.innerText = account.displayAccountInfo();
        });
    </script>
</body>
</html>
