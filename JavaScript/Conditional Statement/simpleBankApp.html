<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Banking System App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Advanced Banking System App</h1>
    <div class="container">
        <div class="account-section">
            <label for="accountSelect">Select Account:</label>
            <select id="accountSelect">
                <option value="1">AbduLLah Abdulsalaam</option>
                <option value="2">Abidah Zakariyyah</option>
            </select>
            <button id="infoBtn" title="Show account info">Account Info</button>
        </div>
        <div class="action-section">
            <input type="number" id="amountInput" placeholder="Enter amount">
            <button id="depositBtn" title="Deposit money">Deposit</button>
            <button id="withdrawBtn" title="Withdraw money">Withdraw</button>
            <button id="balanceBtn" title="Check balance">Check Balance</button>
        </div>
        <div id="output" class="output"></div>
        <h2>Transaction History</h2>
        <ul id="transactionList" class="transaction-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
