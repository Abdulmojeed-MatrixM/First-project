<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking System App</title>
</head>
<body>
    <h1>Simple Banking System App</h1> 
     
    <script>
        class BankAccount {
            constructor(accountNumber, accountHolder, balance = 0) {
                this.accountNumber = accountNumber;
                this.accountHolder = accountHolder;
                this.balance = balance;
            }

            //Define methods of the bank account class to deposit, withraw and check balances of the users accounts

            deposit(amount) {
                this.balance += amount;
                console.log(`$${amount} deposited. Current balance: $${this.balance}`);
            }

            withdraw(amount) {
                if (amount > this.balance) {
                    console.log(`Insufficient funds. Current balance: $${this.balance}`);
                } else {
                    this.balance -= amount;
                    console.log(`$${amount} withdrawn. Current balance: $${this.balance}`);
                }
            }

            checkBalance() {
                console.log(`The current account balance for ${this.accountHolder}: $${this.balance}`);
            }
            displayAccountInfo() {
                console.log(`Account Number: ${this.accountNumber}, Account Holder: ${this.accountHolder}, Balance: $${this.balance}`);
            }
        }

        //create instances of BankAccount
        const account1 = new BankAccount(123456, "AbduLLah Abdulsalaam", 3500);
        const account2 = new BankAccount(654321, "Abidah Zakariyyah");

        //Deposit money
        account1.deposit(1000);
        account2.deposit(950);

        //Withdraw money
        account1.withdraw(500);
        account2.withdraw(350);

        // Check balances
        account1.checkBalance();
        account2.checkBalance();

    </script>
</body>
</html>
