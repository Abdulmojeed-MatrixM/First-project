<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
        }
        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-container input {
            padding: 10px;
            width: 200px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .search-container button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .search-container button:hover {
            background-color: #0056b3;
        }
        .product-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .product {
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 15px;
            padding: 20px;
            width: 250px;
            text-align: center;
        }
        .product h2 {
            font-size: 1.5em;
            color: #007BFF;
            margin: 0 0 10px;
        }
        .product p {
            font-size: 1em;
            color: #666;
        }
        .product .price {
            font-size: 1.2em;
            color: #28a745;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Product Search</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Enter Product Name">
        <button onclick="searchProduct()">Search</button>
    </div>
    <div class="product-list" id="product-list">
        <!-- Product items will be dynamically added here -->
    </div>

    <script>
        const products = [
            { name: "Laptop", description: "A high-performance laptop.", price: 999.99 },
            { name: "Smartphone", description: "A latest model smartphone.", price: 699.99 },
            { name: "Headphones", description: "Noise-cancelling headphones.", price: 199.99 },
            { name: "Smartwatch", description: "A smartwatch with various features.", price: 299.99 },
            { name: "Tablet", description: "A lightweight tablet for everyday use.", price: 399.99 }
        ];

        function displayProducts(products) {
            const productList = document.getElementById("product-list");
            productList.innerHTML = ""; // clear previous results

            products.forEach(product => {
                const productDiv = document.createElement("div");
                productDiv.classList.add("product");

                productDiv.innerHTML = `
                    <h2>${product.name}</h2>
                    <p>${product.description}</p>
                    <p class="price">$${product.price.toFixed(2)}</p>
                `;
                productList.appendChild(productDiv);
            });
        }

        function searchProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(query)
            );
            displayProducts(filteredProducts);
        }
    </script>
</body>
</html>
