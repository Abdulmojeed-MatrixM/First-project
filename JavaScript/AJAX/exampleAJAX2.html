<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log("Start");

        setTimeout(() => {
            console.log("Water is Boiled!");

            // only stir the cup after the water is boiled and other tasks are done
            console.log("Stir the cup!");
        }, 3000); // Wait 3 seconds before stirring

        console.log("While waiting for the water to boil, get the cup!");
        console.log("While waiting for the water to boil, add the tea!");
        console.log("While waiting for the water to boil, add the sugar!");
        console.log("While waiting for the water to boil, add the milk!");

        console.log("End");
    </script>
</body>
</html>
