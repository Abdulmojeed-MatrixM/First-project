<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Array Methods Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>JavaScript Array Methods Interactive Project</h1>
    <div class="container">
        <div class="input-group">
            <input type="text" id="elementInput" placeholder="Enter element">
            <button onclick="addElement()">Add Last (Push)</button>
            <button onclick="addFirst()">Add First (Unshift)</button>
        </div>
        <div class="button-group">
            <button onclick="removeLast()">Remove Last (Pop)</button>
            <button onclick="removeFirst()">Remove First (Shift)</button>
        </div>
        <div class="input-group">
            <input type="number" id="removeIndex" placeholder="Index to remove" min="0">
            <button onclick="removeAtIndex()">Remove at Index (Splice)</button>
        </div>
        <h2>Array Elements:</h2>
        <div id="arrayElements"></div>
    </div>
    <script src="script1.js"></script>
</body>
</html>
