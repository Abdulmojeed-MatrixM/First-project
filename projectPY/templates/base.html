<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
  <nav class="bg-white shadow">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="{{ url_for('index') }}" class="font-bold text-xl">TaskManager</a>
      <div>
        {% if session.user_id %}
          <a href="{{ url_for('tasks.dashboard') }}" class="mr-4">Dashboard</a>
          <a href="{{ url_for('auth.logout') }}" class="text-red-600">Logout</a>
        {% else %}
          <a href="{{ url_for('auth.login') }}" class="mr-4">Login</a>
          <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container mx-auto p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="space-y-2">
          {% for cat, msg in messages %}
            <div class="p-3 rounded {{ 'bg-green-100' if cat=='success' else ('bg-red-100' if cat=='danger' else 'bg-yellow-100') }}">
              {{ msg }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
