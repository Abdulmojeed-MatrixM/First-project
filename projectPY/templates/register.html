<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <!-- ...existing head... -->
</head>
<body>
  <main>
    <!-- explicit message from view -->
    {% if message %}
      <div class="flash-item">{{ message }}</div>
    {% endif %}

    <!-- flash messages fallback -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for msg in messages %}
            <div class="flash-item">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% extends "base.html" %}
    {% block content %}
      <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h2 class="text-xl font-semibold mb-4">Create an account</h2>
        <form method="post">
          <label class="block mb-2">Username</label>
          <input name="username" class="w-full p-2 border rounded mb-3" />
          <label class="block mb-2">Email</label>
          <input name="email" class="w-full p-2 border rounded mb-3" />
          <label class="block mb-2">Password</label>
          <input name="password" type="password" class="w-full p-2 border rounded mb-3" />
          <button class="bg-green-600 text-white px-4 py-2 rounded">Register</button>
        </form>
      </div>
    {% endblock %}
  </main>
</body>
</html>
