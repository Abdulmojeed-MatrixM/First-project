{% extends "base.html" %}
{% block content %}
  <div class="max-w-lg mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-xl font-semibold mb-4">{{ task is defined and 'Edit Task' or 'New Task' }}</h2>
    <form method="post">
      <label class="block">Title</label>
      <input name="title" value="{{ task.title if task is defined else '' }}" class="w-full p-2 border rounded mb-3" />
      <label class="block">Description</label>
      <textarea name="description" class="w-full p-2 border rounded mb-3">{{ task.description if task is defined else '' }}</textarea>
      <label class="block">Due date (YYYY-MM-DD)</label>
      <input name="due_date" value="{{ task.due_date if task is defined else '' }}" class="w-full p-2 border rounded mb-3" />
      <label class="block">Status</label>
      <select name="status" class="w-full p-2 border rounded mb-4">
        {% set s = task.status if task is defined else 'Need to Complete' %}
        <option value="Need to Complete" {{ 'selected' if s=='Need to Complete' else '' }}>Need to Complete</option>
        <option value="In Progress" {{ 'selected' if s=='In Progress' else '' }}>In Progress</option>
        <option value="Completed" {{ 'selected' if s=='Completed' else '' }}>Completed</option>
        <option value="Stopped" {{ 'selected' if s=='Stopped' else '' }}>Stopped</option>
      </select>
      <button class="bg-green-600 text-white px-4 py-2 rounded">{{ task is defined and 'Update' or 'Add Task' }}</button>
    </form>
  </div>
{% endblock %}
