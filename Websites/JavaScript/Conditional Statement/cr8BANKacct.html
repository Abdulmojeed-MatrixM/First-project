<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Banking System App</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1976d2 0%, #64b5f6 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 420px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(25, 118, 210, 0.15);
            padding: 2rem 2.5rem;
        }
        h1 {
            text-align: center;
            color: #1976d2;
            margin-bottom: 1.5rem;
        }
        .tab {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .tab button {
            background: #e3f2fd;
            color: #1976d2;
            border: none;
            border-radius: 20px 20px 0 0;
            padding: 0.7rem 2rem;
            margin: 0 0.2rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .tab button.active {
            background: #1976d2;
            color: #fff;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            font-weight: 500;
            margin-bottom: 0.3rem;
            display: block;
        }
        input, button, select {
            width: 100%;
            padding: 0.7rem;
            border-radius: 6px;
            border: 1px solid #bdbdbd;
            margin-bottom: 0.7rem;
            font-size: 1rem;
        }
        button {
            background: #1976d2;
            color: #fff;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #125ea2;
        }
        .output {
            background: #e3f2fd;
            border-radius: 6px;
            padding: 1rem;
            min-height: 40px;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .transactions {
            background: #f8fafc;
            border-radius: 6px;
            padding: 1rem;
            margin-top: 1rem;
            max-height: 180px;
            overflow-y: auto;
            font-size: 0.97rem;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.07);
        }
        .transaction {
            padding: 0.5rem 0;
            border-bottom: 1px solid #e3f2fd;
        }
        .transaction:last-child {
            border-bottom: none;
        }
        @media (max-width: 500px) {
            .container { padding: 1rem; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <h1>Responsive Banking System App</h1>
    <div class="container">
        <div class="tab">
            <button id="loginTab" class="active">Login</button>
            <button id="registerTab">Register</button>
        </div>
        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginName">Name</label>
                <input type="text" id="loginName" placeholder="Enter your name" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <!-- Register Form -->
        <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label for="registerName">Name</label>
                <input type="text" id="registerName" placeholder="Enter your name" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <!-- Banking Actions -->
        <div id="bankActions" style="display:none;">
            <div class="output" id="welcomeMsg"></div>
            <div class="form-group">
                <label for="amountInput">Amount</label>
                <input type="number" id="amountInput" placeholder="Enter amount">
            </div>
            <button id="depositBtn">Deposit</button>
            <button id="withdrawBtn">Withdraw</button>
            <button id="balanceBtn">Check Balance</button>
            <button id="logoutBtn" style="background:#e53935;margin-top:0.7rem;">Logout</button>
            <div class="transactions" id="transactions"></div>
        </div>
    </div>
    <script>
        // BankAccount class
        class BankAccount {
            constructor(accountHolder) {
                this.accountNumber = BankAccount.generateAccountNumber();
                this.accountHolder = accountHolder;
                this.balance = 0;
                this.transactions = [];
            }
            static generateAccountNumber() {
                return Math.floor(100000 + Math.random() * 900000);
            }
            deposit(amount) {
                this.balance += amount;
                const detail = {
                    type: 'Deposit',
                    amount,
                    date: new Date().toLocaleString(),
                    balance: this.balance
                };
                this.transactions.unshift(detail);
                return `$${amount} deposited. Current balance: $${this.balance}`;
            }
            withdraw(amount) {
                if (amount > this.balance) {
                    const detail = {
                        type: 'Failed Withdrawal',
                        amount,
                        date: new Date().toLocaleString(),
                        balance: this.balance
                    };
                    this.transactions.unshift(detail);
                    return `Insufficient funds. Current balance: $${this.balance}`;
                } else {
                    this.balance -= amount;
                    const detail = {
                        type: 'Withdraw',
                        amount,
                        date: new Date().toLocaleString(),
                        balance: this.balance
                    };
                    this.transactions.unshift(detail);
                    return `$${amount} withdrawn. Current balance: $${this.balance}`;
                }
            }
            checkBalance() {
                return `Current balance: $${this.balance}`;
            }
        }

        // User accounts storage
        const accounts = {};

        // State
        let currentAccount = null;

        // DOM elements
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const bankActions = document.getElementById('bankActions');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const amountInput = document.getElementById('amountInput');
        const depositBtn = document.getElementById('depositBtn');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const balanceBtn = document.getElementById('balanceBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const transactionsDiv = document.getElementById('transactions');

        // Tab switching
        loginTab.onclick = () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.style.display = '';
            registerForm.style.display = 'none';
            bankActions.style.display = 'none';
        };
        registerTab.onclick = () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.style.display = '';
            loginForm.style.display = 'none';
            bankActions.style.display = 'none';
        };

        // Register
        registerForm.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value.trim();
            if (!name) return;
            if (accounts[name.toLowerCase()]) {
                alert('Account already exists. Please login.');
                return;
            }
            const account = new BankAccount(name);
            accounts[name.toLowerCase()] = account;
            alert(`Account created!\nAccount Number: ${account.accountNumber}`);
            registerForm.reset();
            registerTab.classList.remove('active');
            loginTab.classList.add('active');
            loginForm.style.display = '';
            registerForm.style.display = 'none';
        };

        // Login
        loginForm.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('loginName').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!name || !password) return;
            const account = accounts[name.toLowerCase()];
            if (!account) {
                alert('Account not found. Please register.');
                return;
            }
            currentAccount = account;
            showBankActions();
            loginForm.reset();
        };

        // Show banking actions
        function showBankActions() {
            loginForm.style.display = 'none';
            registerForm.style.display = 'none';
            bankActions.style.display = '';
            welcomeMsg.innerHTML = `
                Welcome, <b>${currentAccount.accountHolder}</b>!<br>
                Account Number: <b>${currentAccount.accountNumber}</b>
            `;
            renderTransactions();
        }

        // Deposit
        depositBtn.onclick = () => {
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                welcomeMsg.innerText = "Please enter a valid deposit amount.";
                return;
            }
            welcomeMsg.innerText = currentAccount.deposit(amount);
            amountInput.value = "";
            renderTransactions();
        };

        // Withdraw
        withdrawBtn.onclick = () => {
            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                welcomeMsg.innerText = "Please enter a valid withdrawal amount.";
                return;
            }
            welcomeMsg.innerText = currentAccount.withdraw(amount);
            amountInput.value = "";
            renderTransactions();
        };

        // Check balance
        balanceBtn.onclick = () => {
            welcomeMsg.innerText = currentAccount.checkBalance();
        };

        // Logout
        logoutBtn.onclick = () => {
            currentAccount = null;
            bankActions.style.display = 'none';
            loginForm.style.display = '';
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
        };

        // Render transactions
        function renderTransactions() {
            if (!currentAccount) return;
            if (currentAccount.transactions.length === 0) {
                transactionsDiv.innerHTML = "<i>No transactions yet.</i>";
                return;
            }
            transactionsDiv.innerHTML = currentAccount.transactions.map(tx => `
                <div class="transaction">
                    <b>${tx.type}</b> of <span style="color:#1976d2;">$${tx.amount}</span> 
                    <br>
                    <small>${tx.date}</small>
                    <br>
                    <span style="color:#388e3c;">Balance: $${tx.balance}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
