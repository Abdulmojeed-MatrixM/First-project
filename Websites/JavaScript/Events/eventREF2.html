<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Animation</title>
    <style>
        body {
            margin: 0;
          
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            
        }
        canvas {
            display: block;
            
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            outline: none;
            border-radius: 5px;
            position: absolute;
        }
       
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button id="starButton">Start Animation</button>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const stars = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        function Star(x, y, radius, color, speed) {
            this.x = x;
            this.y = y;
            this.radius = radius;
            this.color = color;
            this.speed = speed;
            this.angle = Math.random() * Math.PI * 2;

            this.update = function () {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.x = centerX;
                    this.y = centerY;
                    this.angle = Math.random() * Math.PI * 2;
                }
            };

            this.draw = function () {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            };
        }

        document.getElementById("starButton").addEventListener("click", function () {
            for (let i = 0; i < 200; i++) {
                const radius = Math.random() * 3 + 1;
                const color = `rgba(255, 255, 255, ${Math.random()})`;
                const speed = Math.random() * 3 + 1;
                stars.push(new Star(centerX, centerY, radius, color, speed));
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.update();
                star.draw();
            });
        }

        animate();
    </script>
</body>
</html>
