<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Info</title>
    <style>
        /* Button styles */
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            position: absolute;
            margin-right: 10px;
        
        }
        
        #pokemonInfo {
            margin-top: 20px;
            padding: 20px;
            border: 2px solid #4CAF50;
            display: none;
        }

        #pokemonImage {
            max-width: 150px;
            margin-top: 10px;
        }

        
    </style>
</head>
<body>
    <button id="fetchPokemon">Fetch Pokemon</button>
    <div id="pokemonInfo">
        <h3 id="pokemonName"></h3>
        <p id="pokemonHeight"></p>
        <p id="pokemonWeight"></p>
        <img id="pokemonImage" src="" alt="Pokemon Image">
    </div>

    <script>
        // Get the button elements
        const fetchPokemonButton = document.getElementById("fetchPokemon");
        const pokemonInfo = document.getElementById("pokemonInfo");
        const pokemonName = document.getElementById("pokemonName");
        const pokemonHeight = document.getElementById("pokemonHeight");
        const pokemonWeight = document.getElementById("pokemonWeight");
        const pokemonImage = document.getElementById("pokemonImage");

        // Function to fetch Pokemon data from API
        async function fetchPokemon() {
            try {
                const response = await fetch("https://pokeapi.co/api/v2/pokemon/pikachu"); // Example: Fetching Pikachu data " another type eevee"
                if (!response.ok) {
                    throw new Error("Network response was not ok " + response.statusText);
                }
                const data = await response.json();
                updatePokemonInfo(data);
            } catch (error) {
                console.error("There has been a problem (Error fetching Pokemon data) with your fetch operation:", error);
            }
        }
        // Function to update the webpage with the fetched Pokemon data
        function updatePokemonInfo(data) {
            pokemonName.textContent = `Name: ${data.name}`;
            pokemonHeight.textContent = `Height: ${data.height}`;
            pokemonWeight.textContent = `Weight: ${data.weight}`;
            pokemonImage.src = data.sprites.front_default;
            pokemonInfo.style.display = "block";
        }

        // Event listener for the fetch Pokemon button
        fetchPokemonButton.addEventListener("click", fetchPokemon);
    </script>
</body>
</html>
