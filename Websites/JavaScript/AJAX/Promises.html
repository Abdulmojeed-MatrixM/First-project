<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        function successCallback(result) {
            console.log(`Audio File ready at URL: ${result}`);
        }

        function failureCallback(error) {
            console.log(`Error Generating Audio File: ${error}`);
        }

        createAudioFileAsynch(audioSettings, successCallback, failureCallback);
    </script>

    <script>
        // Function to stimulate fetching user data from an API
        function fetchUserData() {
            return new Promise((resolve, reject) => {
                console.log("Fetching User Data...");
                
                // Simulate a network request with setTimeout 
                setTimeout(() => {
                    const success = true; // Simulate a successful response

                    if (success) {
                        const userData = { id: 1, name: "Abdullah Downing", age: 25 };
                        console.log("User Data Fetched Succesfully");
                        resolve(userData);
                    } else {
                        reject("Failed to fetch User Data");
                    }
                }, 2000); // Wait for 2 seconds
            });
        }
    </script>
</body>
