<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <!-- Link to external CSS file for styling -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header for the gallery -->
    <h1>Interactive Image Gallery</h1>
    <!-- Input field for image URL and button to add image -->
    <div class="input-group">
        <input type="text" id="imageUrlInput" placeholder="Enter image URL">
        <button id="addImageBtn">Add Image</button>
    </div>
    <!-- Section to display the gallery images -->
    <section id="gallery" class="gallery"></section>
    <!-- Link to external JavaScript file for functionality -->
    <script src="script.js"></script>
</body>
</html>
